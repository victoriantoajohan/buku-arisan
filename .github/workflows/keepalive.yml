# Menjaga project Supabase free tier tidak di-pause (pause terjadi setelah 7 hari tanpa aktivitas).
# Berjalan otomatis setiap 3 hari; bisa juga dijalankan manual dari tab Actions → "Run workflow".
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"   # 03:17 UTC (10:17 WIB) setiap 3 hari
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping database Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js belum berisi URL/anon key"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$URL/rest/v1/rpc/get_arisan" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d '{"p_id":"00000000-0000-4000-8000-000000000000"}')
            echo "Percobaan $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Ping gagal. Kalau project sudah ter-pause, buka dashboard Supabase dan klik Restore."
          cat /tmp/out
          exit 1

      # GitHub menonaktifkan jadwal cron di repo publik setelah 60 hari tanpa commit.
      # Langkah ini membuat commit kecil bila repo sudah 45 hari tidak berubah.
      - name: Jaga jadwal tetap aktif
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Commit terakhir $days hari lalu"
          if [ "$days" -ge 45 ]; then
            date -u +%FT%TZ > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "chore: keep-alive"
            git push
          fi
