<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buku Arisan</title>
<meta name="description" content="Catat iuran arisan, checklist transfer, kocok pemenang, dan kirim pengingat WhatsApp.">
<meta name="theme-color" content="#2C3BA8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232C3BA8'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: ruang kerja bendahara — panel putaran + kocokan di atas, buku anggota di bawah, tab riwayat & pengaturan */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E9EBF2; --ink:#151A2F; --muted:#5B6280; --line:#DADDE8;
  --accent:#2C3BA8; --accent-ink:#FFFFFF; --accent-soft:#E3E6FA;
  --gold:#D9930F; --gold-soft:#FBEFD3; --ok:#18865A; --ok-soft:#DDF3E8; --warn:#BF3A2B; --warn-soft:#FBE3DF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#161A2D; --sunk:#1D2238; --ink:#E8EAF4; --muted:#9BA1BF; --line:#2A3050;
  --accent:#8E9BFF; --accent-ink:#0E1120; --accent-soft:#252C55;
  --gold:#F2B840; --gold-soft:#3A2F14; --ok:#4FC48C; --ok-soft:#15342A; --warn:#F07B6E; --warn-soft:#3D1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#161A2D; --sunk:#1D2238; --ink:#E8EAF4; --muted:#9BA1BF; --line:#2A3050;
  --accent:#8E9BFF; --accent-ink:#0E1120; --accent-soft:#252C55;
  --gold:#F2B840; --gold-soft:#3A2F14; --ok:#4FC48C; --ok-soft:#15342A; --warn:#F07B6E; --warn-soft:#3D1F1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:14px}
.banner.info{background:var(--accent-soft)}
button,.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1.2}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.gold{background:var(--gold);color:#1B1300;border-color:var(--gold)}
button.danger{color:var(--warn)} button.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12.5px;min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.round-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.round-nav .r{display:flex;align-items:center;gap:6px}
.pot{display:flex;flex-direction:column;gap:8px}
.pot .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* kocokan */
.drum{position:relative;border-radius:16px;padding:22px 18px;background:var(--gold-soft);border:1px dashed var(--gold);display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-height:190px;justify-content:center;overflow:hidden}
.drum .slip{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.1;color:var(--ink);word-break:break-word}
.drum .slip.rolling{color:var(--gold);filter:blur(.3px)}
.drum .amt{font-family:var(--f-mono);font-weight:600;color:var(--gold)}
.drum.won{background:linear-gradient(160deg,var(--gold-soft),var(--surface));border-style:solid}
.queue{display:flex;flex-wrap:wrap;gap:6px}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:none;background:transparent;color:var(--muted);padding:8px 14px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{max-width:240px}
/* member rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .who{min-width:0}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row .amt{font-family:var(--f-mono);font-size:14px;text-align:right;white-space:nowrap}
.row .ops{display:flex;gap:2px}
@media (max-width:560px){.row{grid-template-columns:auto 1fr auto}.row .amt{grid-column:2;text-align:left}.row .ops{grid-column:3;grid-row:1}}
.check{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--ok)}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:18px;height:18px}
.edit-row{display:grid;grid-template-columns:2fr 1.2fr 1.4fr auto;gap:8px;padding:12px 4px;border-top:1px solid var(--line);align-items:end}
@media (max-width:640px){.edit-row{grid-template-columns:1fr 1fr}.edit-row .full{grid-column:1/-1}}
.add{display:grid;grid-template-columns:2fr 1.2fr 1.4fr auto;gap:10px;align-items:end;background:var(--sunk);padding:14px;border-radius:12px}
@media (max-width:640px){.add{grid-template-columns:1fr 1fr}.add .full{grid-column:1/-1}}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
/* matrix */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
th small{display:block;font-weight:500;font-size:11px}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--sunk)}
th.cur{color:var(--accent)}
.cell{width:30px;height:30px;border-radius:8px;border:none;padding:0;display:inline-grid;place-items:center;font-size:13px;font-weight:700;background:var(--sunk);color:var(--muted)}
.cell.paid{background:var(--ok-soft);color:var(--ok)}
.cell.late{background:var(--warn-soft);color:var(--warn)}
.cell.win{outline:2px solid var(--gold);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .cell{width:20px;height:20px;font-size:11px}
.log{display:flex;flex-direction:column;gap:6px;font-size:13.5px;max-height:260px;overflow:auto}
.log div{display:flex;gap:10px}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
footer{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.hdr-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.login{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.login input{max-width:200px}
.landing{max-width:720px;width:100%;margin:0 auto}
.hero p{max-width:60ch;color:var(--muted);margin:8px 0 0}
.recent a{color:var(--accent);font-weight:600;text-decoration:none}
.recent a:hover{text-decoration:underline}
.err{color:var(--warn);font-size:13.5px;font-weight:600}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
